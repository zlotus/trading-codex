[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "trading-codex"
version = "0.1.0"
description = "Personal AI-assisted A-share trading decision workspace"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "baostock>=0.8.9,<1",
  "fastapi>=0.115,<1",
  "pyarrow>=18,<22",
  "pydantic-settings>=2.7,<3",
  "uvicorn>=0.34,<1",
]

[project.scripts]
trading-codex-api = "trading_codex.main:run"
trading-codex-data = "trading_codex.data.cli:main"
trading-codex-baostock = "trading_codex.baostock_download.download_cli:main"
trading-codex-requirements = "trading_codex.data.requirements_cli:main"
trading-codex-ai-research = "trading_codex.ai.research_cli:main"
trading-codex-ops = "trading_codex.operations.cli:main"
trading-codex-m8-smoke = "trading_codex.backtest.m8_smoke:main"

[dependency-groups]
dev = [
  "httpx2>=2,<3",
  "pytest>=8.3,<9",
  "ruff>=0.9,<1",
]

[tool.hatch.build.targets.wheel]
packages = ["backend/src/trading_codex"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["backend/tests"]

[tool.ruff]
line-length = 100
src = ["backend/src", "backend/tests"]
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
